[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cwe-witness"
version = "0.1.0"
description = "Evidence-based verification of C CWE claims"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "pydantic>=2,<3", "PyYAML>=6,<7"]

[project.scripts]
cweverify = "cwe_witness.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "types-PyYAML"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
check_untyped_defs = true
